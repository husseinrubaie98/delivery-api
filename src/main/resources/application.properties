# Startup
spring.application.name=delivery-api

# Database
# spring.datasource.url=jdbc:mysql://#ocalhost:3306/delivery_db
# spring.datasource.username=root
# spring.datasource.password=admin123
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# Server Config (Web)
server.port=8090
server.servlet.context-path=/training
server.servlet.session.timeout=15m

# Spring Boot Actuator Configuration, can use "*"
management.endpoints.web.exposure.include=health,info
management.endpoints.web.exposure.exclude=metrics,beans
management.info.env.enabled=true

# Spring Security Config
spring.security.user.name=admin
spring.security.user.password=admin123

info.app.name=Delivery API
info.app.description=API for managing deliveries
info.app.version=1.0.0
info.author.firstname=Hussein
info.author.lastname=Rubaie

# Logging Levels (Core)
logging.level.org.springbootframework=INFO
logging.level.org.hibernate=TRACE
logging.level.com.husseinrubaie=DEBUG