<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: page('Check your email', ~{::content})}">
<body>
<th:block th:fragment="content">

    <section class="px-4 sm:px-8 py-16 sm:py-24 flex justify-center">
        <div class="card w-full max-w-md bg-base-100 shadow-sm border border-base-content/10 text-center">
            <div class="card-body items-center gap-3">

                <span class="icon-[tabler--mail-opened] size-14 text-primary"></span>
                <h1 class="text-2xl font-bold">Check your email</h1>

                <p class="text-base-content/70" th:if="${email}">
                    We sent a verification link to
                    <strong class="text-base-content" th:text="${email}">you@example.com</strong>.
                </p>
                <p class="text-base-content/70" th:unless="${email}">
                    We sent a verification link to your email address.
                </p>

                <div class="alert alert-soft alert-info items-start text-left" role="alert">
                    <span class="icon-[tabler--info-circle] size-5 shrink-0 mt-0.5"></span>
                    <p class="text-sm">
                        Your account stays inactive until the email is verified.
                        The link expires in <strong>24 hours</strong>.
                    </p>
                </div>

                <div class="mt-2 flex flex-wrap justify-center gap-2">
                    <a class="btn btn-primary" th:href="@{/login}">Go to sign in</a>
                    <a class="btn btn-text" th:href="@{/}">Back to home</a>
                </div>

                <p class="text-xs text-base-content/50 mt-2">
                    Wrong email address?
                    <a class="link link-primary" th:href="@{/register}">Register again</a>
                </p>

            </div>
        </div>
    </section>

</th:block>
</body>
</html>
