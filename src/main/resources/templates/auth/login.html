<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: page('Sign in', ~{::content})}">
<body>
<th:block th:fragment="content">

    <section class="px-4 sm:px-8 py-12 sm:py-20 flex justify-center">
        <div class="card w-full max-w-md bg-base-100 shadow-sm border border-base-content/10">
            <div class="card-body gap-5">

                <div class="text-center">
                    <span class="icon-[tabler--lock] size-10 text-primary"></span>
                    <h1 class="text-2xl font-bold mt-2">Sign in</h1>
                    <p class="text-base-content/70 mt-1">
                        Welcome back. Sign in to manage your deliveries.
                    </p>
                </div>

                <!-- Spring Security redirects here with ?error on failed authentication. -->
                <div th:if="${param.error}" class="alert alert-soft alert-error items-start" role="alert">
                    <span class="icon-[tabler--alert-circle] size-5 shrink-0 mt-0.5"></span>
                    <p class="text-sm">
                        Invalid email or password. Please try again.
                    </p>
                </div>

                <!-- Spring Security redirects here with ?logout after signing out. -->
                <div th:if="${param.logout}" class="alert alert-soft alert-success items-start" role="alert">
                    <span class="icon-[tabler--circle-check] size-5 shrink-0 mt-0.5"></span>
                    <p class="text-sm">
                        You have been signed out.
                    </p>
                </div>

                <form th:action="@{/login}" method="post" class="space-y-4" novalidate>

                    <!-- Email (form-login username parameter) -->
                    <div>
                        <label class="label-text" for="email">Email</label>
                        <input type="email" id="email" name="email" class="input w-full"
                               placeholder="you@example.com" autocomplete="email" autofocus/>
                    </div>

                    <!-- Password -->
                    <div>
                        <label class="label-text" for="password">Password</label>
                        <div class="input w-full">
                            <input type="password" id="password" name="password"
                                   placeholder="Your password" autocomplete="current-password"/>
                            <button type="button" class="block cursor-pointer" aria-label="Toggle password visibility"
                                    data-toggle-password='{ "target": "#password" }'>
                                <span class="icon-[tabler--eye] password-active:block hidden size-5 shrink-0 text-base-content/60"></span>
                                <span class="icon-[tabler--eye-off] password-active:hidden block size-5 shrink-0 text-base-content/60"></span>
                            </button>
                        </div>
                    </div>

                    <!-- Remember me + forgot password -->
                    <div class="flex items-center justify-between gap-2">
                        <div class="flex items-center gap-2">
                            <input type="checkbox" id="remember-me" name="remember-me"
                                   class="checkbox checkbox-sm checkbox-primary"/>
                            <label class="label-text text-sm" for="remember-me">
                                Keep me signed in for 30 days
                            </label>
                        </div>
                        <a class="link link-primary text-sm" th:href="@{/forgot-password}">
                            Forgot password?
                        </a>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">Sign in</button>
                </form>

                <p class="text-center text-sm text-base-content/70">
                    New shop?
                    <a class="link link-primary link-animated" th:href="@{/register}">Create an account</a>
                </p>

            </div>
        </div>
    </section>

</th:block>
</body>
</html>
