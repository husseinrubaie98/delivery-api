<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: page('Reset password', ~{::content})}">
<body>
<th:block th:fragment="content">

    <section class="px-4 sm:px-8 py-12 sm:py-20 flex justify-center">
        <div class="card w-full max-w-md bg-base-100 shadow-sm border border-base-content/10">
            <div class="card-body gap-5">

                <div class="text-center">
                    <span class="icon-[tabler--lock-cog] size-10 text-primary"></span>
                    <h1 class="text-2xl font-bold mt-2">Set a new password</h1>
                    <p class="text-base-content/70 mt-1">
                        Choose a new password for your account.
                    </p>
                </div>

                <form th:action="@{/reset-password}" th:object="${form}" method="post"
                      class="space-y-4" novalidate>

                    <input type="hidden" th:field="*{token}"/>

                    <!-- New password -->
                    <div>
                        <label class="label-text" for="password">New password</label>
                        <div class="input w-full"
                             th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                            <input type="password" th:field="*{password}"
                                   placeholder="8+ characters" autocomplete="new-password"/>
                            <button type="button" class="block cursor-pointer" aria-label="Toggle password visibility"
                                    data-toggle-password='{ "target": "#password" }'>
                                <span class="icon-[tabler--eye] password-active:block hidden size-5 shrink-0 text-base-content/60"></span>
                                <span class="icon-[tabler--eye-off] password-active:hidden block size-5 shrink-0 text-base-content/60"></span>
                            </button>
                        </div>
                        <p class="text-base-content/50 text-xs mt-1"
                           th:unless="${#fields.hasErrors('password')}">
                            At least 8 characters, with an uppercase letter, a lowercase letter, and a number.
                        </p>
                        <p class="text-error text-xs mt-1"
                           th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                    </div>

                    <!-- Confirm new password -->
                    <div>
                        <label class="label-text" for="confirmPassword">Confirm new password</label>
                        <div class="input w-full"
                             th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'">
                            <input type="password" th:field="*{confirmPassword}"
                                   placeholder="Repeat your new password" autocomplete="new-password"/>
                            <button type="button" class="block cursor-pointer" aria-label="Toggle password visibility"
                                    data-toggle-password='{ "target": "#confirmPassword" }'>
                                <span class="icon-[tabler--eye] password-active:block hidden size-5 shrink-0 text-base-content/60"></span>
                                <span class="icon-[tabler--eye-off] password-active:hidden block size-5 shrink-0 text-base-content/60"></span>
                            </button>
                        </div>
                        <p class="text-error text-xs mt-1"
                           th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">Reset password</button>
                </form>

                <p class="text-center text-sm text-base-content/70">
                    <a class="link link-primary link-animated" th:href="@{/login}">Back to sign in</a>
                </p>

            </div>
        </div>
    </section>

</th:block>
</body>
</html>
