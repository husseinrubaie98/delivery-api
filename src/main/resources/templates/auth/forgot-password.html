<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: page('Forgot password', ~{::content})}">
<body>
<th:block th:fragment="content">

    <section class="px-4 sm:px-8 py-12 sm:py-20 flex justify-center">
        <div class="card w-full max-w-md bg-base-100 shadow-sm border border-base-content/10">
            <div class="card-body gap-5">

                <div class="text-center">
                    <span class="icon-[tabler--key] size-10 text-primary"></span>
                    <h1 class="text-2xl font-bold mt-2">Forgot your password?</h1>
                    <p class="text-base-content/70 mt-1">
                        Enter your email and we&rsquo;ll send you a link to reset it.
                    </p>
                </div>

                <form th:action="@{/forgot-password}" th:object="${form}" method="post"
                      class="space-y-4" novalidate>

                    <div>
                        <label class="label-text" for="email">Email</label>
                        <input type="email" th:field="*{email}" class="input w-full"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                               placeholder="you@example.com" autocomplete="email" autofocus/>
                        <p class="text-error text-xs mt-1"
                           th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
                </form>

                <p class="text-center text-sm text-base-content/70">
                    Remembered it?
                    <a class="link link-primary link-animated" th:href="@{/login}">Back to sign in</a>
                </p>

            </div>
        </div>
    </section>

</th:block>
</body>
</html>
